# Настройки учебного симулятора.
#
# Здесь лежит всё, что ВЫБИРАЕТ ЧЕЛОВЕК: полигон, файл рельефа, порты, число
# учеников. То, что можно УЗНАТЬ У ДАННЫХ (шаг сетки рельефа, охват, система
# координат), код читает из самого файла и в конфиг не выносится — два
# источника правды про одно и то же дают тихую ошибку при первой же замене
# файла.

polygon:
  name: "test-range"

  # Точка старта аппарата. Высота — над уровнем моря, в метрах.
  home_latitude_deg: 49.570314
  home_longitude_deg: 34.38011
  home_elevation_asl_m: 153.0
  home_heading_deg: 96.15

terrain:
  # Файл высот (DEM). Тот же путь берёт скрипт сборки тайлов рельефа для
  # Cesium — так физика и картинка гарантированно растут из одного файла.
  dem_path: "data/terrain/polygon.tif"

  # Поправка на разные точки отсчёта высоты, в метрах.
  #
  # DEM обычно отсчитана от геоида EGM96 («уровень моря»), а полёт ведётся в
  # высотах над эллипсоидом WGS84 (к нему привязан GPS). Между ними 20-50 м
  # расхождения. Число постоянное для полигона; измеряется один раз — берём
  # точку с известной высотой и сверяем, что показывают DEM и телеметрия.
  #
  # Поправка применяется при визуализации: h_WGS84 = H_MSL + N.
  # В мосте физика, старт и ArduPilot сохраняют H_MSL; DEM не сдвигается.
  # Ноль означает общий учебный уровень, а не измеренную модель геоида.
  geoid_separation_m: 0.0

  # Как часто сообщать высоту рельефа в JSBSim.
  # Самолёт идёт ~30 м/с, за такт при 10 Гц проходит 3 метра — десятая часть
  # ячейки 30-метровой сетки. Чаще не нужно даже в горах.
  update_hz: 10.0

  # Насколько быстро земле разрешено менять высоту, метров в секунду.
  #
  # Резкий скачок земли под стоящим аппаратом разрушает физику: стойки шасси
  # оказываются в грунте, силы уходят в бесконечность, состояние становится
  # NaN. Проверено на JSBSim 1.3.1 — подъём на 300 м за такт убивает симуляцию.
  #
  # Бьёт это прежде всего по старту: JSBSim начинает с землёй на нуле, а
  # аэродром на 179 м. Ограничение растягивает эту разницу на несколько секунд.
  #
  # 50 м/с с запасом перекрывает реальность: самолёт на 30 м/с над склоном в
  # 45 градусов меняет высоту земли ровно на 30 м/с.
  max_change_rate_m_per_s: 50.0

  # Если файла DEM нет — земля становится плоской на этой высоте.
  # Нужно, чтобы симулятор запускался, пока данные полигона готовят.
  fallback_elevation_asl_m: 153.0

  # DEM меньше этого размера читается в память целиком, больше — окнами вокруг
  # аппарата. Сетка 30 м на 100 км² — пара мегабайт, читается целиком; съёмка с
  # шагом 1 м — гигабайты, только окнами.
  in_memory_limit_mb: 256

ardupilot:
  sim_vehicle_path: "third_party/ardupilot/Tools/autotest/sim_vehicle.py"
  vehicle: "ArduPlane"
  frame: "jsbsim"
  # Дополнительные аргументы sim_vehicle.py, если понадобятся.
  extra_args: []

jsbsim:
  # Модель планера из состава JSBSim.
  aircraft_model: "Rascal"

  # Порты. У каждого ученика свой набор: базовый порт + номер * шаг.
  # 5504/5505 — то, что ArduPilot занимает под обмен с JSBSim сам.
  # 5560 — наш собственный вход, через него мы шлём высоту рельефа.
  fdm_port_base: 5504
  console_port_base: 5505
  terrain_input_port_base: 5560
  # Отсюда браузер берёт положение и углы аппарата — 50 раз в секунду.
  # Через MAVLink было бы 4-10 раз, и модель на глобусе дёргалась бы.
  pose_output_port_base: 5620
  pose_output_hz: 50.0

  # Куда JSBSim шлёт позу. Физика работает в контейнере Linux, а мост и
  # браузер — на хосте, поэтому "127.0.0.1" отправил бы пакеты в никуда:
  # внутри контейнера это он сам. host.docker.internal — имя, которое Docker
  # заводит специально для обращения из контейнера к хосту.
  # Если однажды всё будет работать в одной системе, поставить 127.0.0.1.
  pose_output_host: "host.docker.internal"
  port_stride: 10

  # Слушать только локальный интерфейс. Консоль JSBSim принимает любые команды
  # без проверки — в учебной сети этот порт торчать наружу не должен.
  bind_host: "127.0.0.1"

students:
  # Сколько учеников одновременно. Одна пара SITL+JSBSim ≈ одно ядро.
  count: 5
  first_instance_index: 0
